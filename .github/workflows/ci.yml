name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@04108fa0c67d9a79c0f6d1ade4dd78df3ad8a4a7

  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag pulse-console:local .
      - name: Check the image holds no test files or dev packages
        run: |
          found=$(docker run --rm --entrypoint sh pulse-console:local -c "find /app -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then
            echo "Test files in the image:"
            echo "$found"
            exit 1
          fi
          for path in /app/node_modules/@biomejs /app/node_modules/lefthook /app/node_modules/typescript7 /app/bunfig.toml; do
            if docker run --rm --entrypoint sh pulse-console:local -c "test -e $path"; then
              echo "Dev-only path in the image: $path"
              exit 1
            fi
          done
      - name: Image ignores dotenv files
        run: bash scripts/image-dotenv.sh pulse-console:local
      - name: Start the container and wait for /readyz
        run: |
          docker run -d --name console -p 127.0.0.1:8082:8082 \
            -v console-ci-data:/data \
            -e PULSE_API_URL=http://api.invalid:3000 \
            -e PULSE_CONSOLE_ADMIN_TOKEN=console-ci-sentinel-token-0123456789ab \
            pulse-console:local
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/readyz || true)
            if [ "$code" = "200" ]; then
              echo "ok: /readyz answers 200"
              exit 0
            fi
            sleep 0.5
          done
          echo "/readyz did not answer 200 within 30 s"
          docker logs console
          exit 1
      - name: Check the container runs as non-root
        run: |
          uid=$(docker exec console id -u)
          if [ "$uid" = "0" ]; then
            echo "The container runs as root"
            exit 1
          fi
          echo "ok: uid $uid"
      - name: Check the page and its headers
        run: |
          curl -fsSL http://127.0.0.1:8082/ > page.html
          grep -F 'pulse Console' page.html
          curl -sIL http://127.0.0.1:8082/ | grep -i 'x-frame-options: DENY'
      - name: Check the log holds one setup code line
        run: |
          count=$(docker logs console 2>&1 | grep -cE 'pulse-console setup code: [0-9a-f]{4}(-[0-9a-f]{4}){7}' || true)
          if [ "$count" != "1" ]; then
            echo "Setup code lines in the log: $count"
            exit 1
          fi
          echo "ok: one setup code line"
      - name: Check the database file owner and mode
        run: |
          bun_uid=$(docker exec console id -u bun)
          got=$(docker exec console stat -c '%u %a' /data/console.db)
          if [ "$got" != "$bun_uid 600" ]; then
            echo "Owner and mode of /data/console.db: $got"
            exit 1
          fi
          echo "ok: $got"
      - name: Check the token is not in the database
        run: |
          docker exec console sh -c '
            set -u
            db=/data/console.db
            test -f "$db" || { echo "$db is not a regular file"; exit 1; }
            test -r "$db" || { echo "$db is not readable"; exit 1; }
            files="$db"
            for side in "$db-wal" "$db-shm"; do
              if test -e "$side"; then
                test -r "$side" || { echo "$side is not readable"; exit 1; }
                files="$files $side"
              fi
            done
            [ "$(head -c 15 "$db")" = "SQLite format 3" ] || { echo "$db has no SQLite header"; exit 1; }
            for f in $files; do
              out=$(grep -a -c -F console-ci-sentinel-token-0123456789ab "$f")
              code=$?
              if [ "$code" != "1" ] || [ "$out" != "0" ]; then
                echo "scan of $f: exit $code, count $out"
                exit 1
              fi
            done
            echo "ok: the token is not in $files"
          '
      - name: Check the admin token is not in the logs or the page
        run: |
          if docker logs console 2>&1 | grep -F 'console-ci-sentinel-token-0123456789ab'; then
            echo "The admin token is in the logs"
            exit 1
          fi
          if grep -F 'console-ci-sentinel-token-0123456789ab' page.html; then
            echo "The admin token is in the page"
            exit 1
          fi
          echo "ok: the token is not in the logs or the page"
      - name: Check docker stop exits 0
        run: |
          docker stop -t 10 console
          code=$(docker inspect -f '{{.State.ExitCode}}' console)
          if [ "$code" != "0" ]; then
            echo "Exit code after docker stop: $code"
            docker logs console
            exit 1
          fi
          echo "ok: exit code 0"
      - name: Check a missing PULSE_API_URL exits 2
        run: |
          set +e
          docker run --rm pulse-console:local 2> stderr.txt
          code=$?
          set -e
          cat stderr.txt
          if [ "$code" != "2" ]; then
            echo "Exit code without PULSE_API_URL: $code"
            exit 1
          fi
          grep -F 'PULSE_API_URL must be set' stderr.txt

  release:
    if: github.ref_type == 'tag'
    needs: [check, docker]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lorenzh/pulse-config/.github/workflows/release.yml@04108fa0c67d9a79c0f6d1ade4dd78df3ad8a4a7
