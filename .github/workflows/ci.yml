name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@04108fa0c67d9a79c0f6d1ade4dd78df3ad8a4a7

  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag pulse-console:local .
      - name: Check the image holds no test files or dev packages
        run: |
          found=$(docker run --rm --entrypoint sh pulse-console:local -c "find /app -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then
            echo "Test files in the image:"
            echo "$found"
            exit 1
          fi
          for path in /app/node_modules/@biomejs /app/node_modules/lefthook /app/node_modules/typescript7 /app/bunfig.toml /app/node_modules/playwright /app/node_modules/@axe-core /app/test /app/e2e; do
            if docker run --rm --entrypoint sh pulse-console:local -c "test -e $path"; then
              echo "Dev-only path in the image: $path"
              exit 1
            fi
          done
      - name: Image ignores dotenv files
        run: bash scripts/image-dotenv.sh pulse-console:local
      - name: Start the container and wait for /readyz
        run: |
          docker run -d --name console -p 127.0.0.1:8082:8082 \
            -v console-ci-data:/data \
            -e PULSE_API_URL=http://api.invalid:3000 \
            -e PULSE_CONSOLE_ADMIN_TOKEN=console-ci-sentinel-token-0123456789ab \
            pulse-console:local
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/readyz || true)
            if [ "$code" = "200" ]; then
              echo "ok: /readyz answers 200"
              exit 0
            fi
            sleep 0.5
          done
          echo "/readyz did not answer 200 within 30 s"
          docker logs console
          exit 1
      - name: Check the container runs as non-root
        run: |
          uid=$(docker exec console id -u)
          if [ "$uid" = "0" ]; then
            echo "The container runs as root"
            exit 1
          fi
          echo "ok: uid $uid"
      - name: Check the page and its headers
        run: |
          curl -fsSL http://127.0.0.1:8082/ > page.html
          grep -F 'pulse Console' page.html
          curl -sIL http://127.0.0.1:8082/ | grep -i 'x-frame-options: DENY'
      - name: Check the test routes are absent and the script is served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/__test/states/empty)
          if [ "$code" != "404" ]; then
            echo "GET /__test/states/empty answered $code"
            exit 1
          fi
          echo "ok: /__test/states/empty answers 404"
          type=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://127.0.0.1:8082/console.js)
          if [ "$type" != "200 text/javascript; charset=utf-8" ]; then
            echo "GET /console.js answered $type"
            exit 1
          fi
          echo "ok: /console.js answers $type"
      - name: Check the log holds one setup code line
        run: |
          count=$(docker logs console 2>&1 | grep -cE 'pulse-console setup code: [0-9a-f]{4}(-[0-9a-f]{4}){7}' || true)
          if [ "$count" != "1" ]; then
            echo "Setup code lines in the log: $count"
            exit 1
          fi
          echo "ok: one setup code line"
      - name: Check the owner recovery command refuses before setup
        run: |
          set +e
          err=$(docker exec console bun --no-env-file src/owner-reset.ts 2>&1 >/dev/null)
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "owner-reset exited $code"
            exit 1
          fi
          case "$err" in
            *"pulse-console: no owner account: finish setup first"*) ;;
            *) echo "owner-reset stderr: $err"; exit 1 ;;
          esac
          echo "ok: owner-reset exits 2 before setup"
      - name: Check the database file owner and mode
        run: |
          bun_uid=$(docker exec console id -u bun)
          got=$(docker exec console stat -c '%u %a' /data/console.db)
          if [ "$got" != "$bun_uid 600" ]; then
            echo "Owner and mode of /data/console.db: $got"
            exit 1
          fi
          echo "ok: $got"
      - name: Check the token is not in the database
        run: |
          docker exec console sh -c '
            set -u
            db=/data/console.db
            test -f "$db" || { echo "$db is not a regular file"; exit 1; }
            test -r "$db" || { echo "$db is not readable"; exit 1; }
            files="$db"
            for side in "$db-wal" "$db-shm"; do
              if test -e "$side"; then
                test -r "$side" || { echo "$side is not readable"; exit 1; }
                files="$files $side"
              fi
            done
            [ "$(head -c 15 "$db")" = "SQLite format 3" ] || { echo "$db has no SQLite header"; exit 1; }
            for f in $files; do
              out=$(grep -a -c -F console-ci-sentinel-token-0123456789ab "$f")
              code=$?
              if [ "$code" != "1" ] || [ "$out" != "0" ]; then
                echo "scan of $f: exit $code, count $out"
                exit 1
              fi
            done
            echo "ok: the token is not in $files"
          '
      - name: Check the admin token is not in the logs or the page
        run: |
          if docker logs console 2>&1 | grep -F 'console-ci-sentinel-token-0123456789ab'; then
            echo "The admin token is in the logs"
            exit 1
          fi
          if grep -F 'console-ci-sentinel-token-0123456789ab' page.html; then
            echo "The admin token is in the page"
            exit 1
          fi
          echo "ok: the token is not in the logs or the page"
      - name: Check docker stop exits 0
        run: |
          docker stop -t 10 console
          code=$(docker inspect -f '{{.State.ExitCode}}' console)
          if [ "$code" != "0" ]; then
            echo "Exit code after docker stop: $code"
            docker logs console
            exit 1
          fi
          echo "ok: exit code 0"
      - name: Check a missing PULSE_API_URL exits 2
        run: |
          set +e
          docker run --rm pulse-console:local 2> stderr.txt
          code=$?
          set -e
          cat stderr.txt
          if [ "$code" != "2" ]; then
            echo "Exit code without PULSE_API_URL: $code"
            exit 1
          fi
          grep -F 'PULSE_API_URL must be set' stderr.txt
      - name: Check a malformed key file exits 2
        run: |
          printf 'not-a-key' > key.txt
          chmod 644 key.txt
          set +e
          docker run --rm \
            -e PULSE_API_URL=http://api.invalid:3000 \
            -e PULSE_CONSOLE_SECRET_KEY_FILE=/run/key \
            -v "$PWD/key.txt:/run/key:ro" \
            pulse-console:local 2> key-stderr.txt
          code=$?
          set -e
          cat key-stderr.txt
          if [ "$code" != "2" ]; then
            echo "Exit code with a malformed key file: $code"
            exit 1
          fi
          grep -F 'PULSE_CONSOLE_SECRET_KEY_FILE=/run/key: must hold 64 lowercase hex characters' key-stderr.txt
          if grep -F 'not-a-key' key-stderr.txt; then
            echo "The key file content is in stderr"
            exit 1
          fi
          echo "ok: a malformed key file exits 2 without its content"

  # The dev stack of pulse-deploy main with this console checkout and the two-factor flow.
  deploy-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pulse-console
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-deploy
          ref: main
          path: pulse-deploy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-api
          ref: main
          path: pulse-api
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-probe
          ref: main
          path: pulse-probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-status
          ref: main
          path: pulse-status
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lorenzh/pulse-notify
          ref: main
          path: pulse-notify
          persist-credentials: false
      - working-directory: pulse-deploy
        run: scripts/init-secrets.sh
      - working-directory: pulse-deploy
        run: docker compose -f dev/compose.yaml up -d --build
      - working-directory: pulse-deploy
        run: scripts/wait-ready.sh dev/compose.yaml 900
      - name: Console two-factor flow
        working-directory: pulse-deploy
        run: E2E_CONSOLE_FLOW=two-factor bash e2e/console-setup.sh dev/compose.yaml
      - name: Stack state and logs
        if: failure()
        working-directory: pulse-deploy
        run: |
          docker compose -f dev/compose.yaml ps --all
          docker compose -f dev/compose.yaml logs --no-color
      - name: Teardown
        if: always()
        working-directory: pulse-deploy
        run: docker compose -f dev/compose.yaml down -v --remove-orphans

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser checks
        run: bun run check:browser

  release:
    if: github.ref_type == 'tag'
    needs: [check, docker, browser]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lorenzh/pulse-config/.github/workflows/release.yml@04108fa0c67d9a79c0f6d1ade4dd78df3ad8a4a7
